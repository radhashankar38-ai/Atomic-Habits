Builds:
  - versionName: 1.2.0
    versionCode: 2
    commit: v1.2.0
    subdir: flutter_app
    sudo:
      - apt-get update
      - apt-get install -y curl git unzip xz-utils zip libglu1-mesa clang cmake
          ninja-build pkg-config libgtk-3-dev
    init:
      - curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.32.2-stable.tar.xz
          -o /tmp/flutter.tar.xz
      - tar xf /tmp/flutter.tar.xz -C /opt
      - export PATH="$PATH:/opt/flutter/bin"
      - flutter precache --android
    build:
      - export PATH="$PATH:/opt/flutter/bin"
      - flutter pub get
      - flutter build apk --release --target-platform android-arm,android-arm64
          --no-pub
    output: build/app/outputs/flutter-apk/app-release.apk
    scanignore:
      - flutter_app/build
    scandelete:
      - flutter_app/build

