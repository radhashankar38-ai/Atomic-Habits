AutoName: Atomic Habits
Name: Atomic-Habits
Summary: Track habits with activity rings, checklists, timers, widgets & reminders.
Description: |-
  Atomic Habits is a free, open-source, privacy-first Android habit tracker
  inspired by James Clear's Tiny Changes, Remarkable Results.

  Features:

  * Daily habit checklists with completion streaks
  * Activity rings showing today's and weekly progress at a glance
  * GitHub-style consistency heatmap calendar
  * Built-in habit timers (focus / countdown)
  * Home screen widgets (1×1, 2×2, 4×2)
  * Local notifications and scheduled reminders
  * Milestone badges and exportable completion certificates
  * 100% offline — zero ads, zero telemetry, zero cloud

  All data is stored locally on the device. No account, no login, no network
  required. Runtime font fetching is disabled; Inter and JetBrains Mono fonts
  are bundled at build time (google_fonts 9.x asset loading).

